name: Build APK - محطات إذاعية

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          set -e
          P=android
          J=$P/app/src/main/java/com/dahshansoft/radio
          mkdir -p $J $P/app/src/main/assets $P/app/src/main/res/mipmap-xxhdpi $P/app/src/main/res/mipmap-xxxhdpi
          cp index.html manifest.json icon-192.png icon-512.png $P/app/src/main/assets/
          cp icon-192.png $P/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MahattatIdhaiya"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > $P/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dahshansoft.radio'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.dahshansoft.radio'
                  minSdk 24
                  targetSdk 35
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="محطات إذاعية"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RadioService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.dahshansoft.radio;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import java.lang.ref.WeakReference;

          public class MainActivity extends Activity {
              static WeakReference<MainActivity> instance = new WeakReference<>(null);
              private static final String HOST = "appassets.androidplatform.net";
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = new WeakReference<>(this);
                  getWindow().setStatusBarColor(0xFF2A1A12);
                  getWindow().setNavigationBarColor(0xFF2A1A12);

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF2A1A12);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                  });

                  web.addJavascriptInterface(new Bridge(), "DahshanApp");
                  web.loadUrl("https://" + HOST + "/assets/index.html");
              }

              void runJs(final String js) {
                  if (web != null) web.post(() -> { if (web != null) web.evaluateJavascript(js, null); });
              }

              // زر الرجوع يُخفي التطبيق ولا يغلقه، فيبقى الراديو شغّالًا
              @Override
              public void onBackPressed() {
                  moveTaskToBack(true);
              }

              @Override
              protected void onDestroy() {
                  stopService(new Intent(this, RadioService.class));
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }

              public class Bridge {
                  @JavascriptInterface
                  public void state(final boolean playing, final String title) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(MainActivity.this, RadioService.class);
                          try {
                              if (playing) {
                                  i.putExtra("title", title);
                                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                                  else startService(i);
                              } else {
                                  stopService(i);
                              }
                          } catch (Exception ignored) {}
                      });
                  }
              }
          }
          EOF

          cat > $J/RadioService.java <<'EOF'
          package com.dahshansoft.radio;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class RadioService extends Service {
              static final String CHANNEL = "radio_playback";
              static final String ACTION_STOP = "com.dahshansoft.radio.STOP";
              private PowerManager.WakeLock wake;
              private WifiManager.WifiLock wifi;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      MainActivity a = MainActivity.instance.get();
                      if (a != null) a.runJs("powerOff()");
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  String title = intent != null ? intent.getStringExtra("title") : null;
                  if (title == null || title.isEmpty()) title = "محطات إذاعية";

                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "تشغيل الراديو", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }

                  int pf = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP), pf);
                  PendingIntent stop = PendingIntent.getService(this, 1,
                          new Intent(this, RadioService.class).setAction(ACTION_STOP), pf);

                  Notification.Builder nb = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, CHANNEL)
                          : new Notification.Builder(this);
                  nb.setSmallIcon(android.R.drawable.ic_media_play)
                    .setContentTitle(title)
                    .setContentText("على الهواء — محطات إذاعية")
                    .setContentIntent(open)
                    .setOngoing(true)
                    .setShowWhen(false)
                    .addAction(new Notification.Action.Builder((Icon) null, "إيقاف", stop).build());
                  Notification n = nb.build();

                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(1, n);

                  if (wake == null) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "radio:playback");
                      wake.setReferenceCounted(false);
                      wake.acquire();
                  }
                  if (wifi == null) {
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(WIFI_SERVICE);
                      if (wm != null) {
                          wifi = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "radio:wifi");
                          wifi.setReferenceCounted(false);
                          wifi.acquire();
                      }
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (wake != null && wake.isHeld()) wake.release();
                  if (wifi != null && wifi.isHeld()) wifi.release();
                  wake = null;
                  wifi = null;
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mahattat-idhaiya.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahattat-idhaiya-apk
          path: mahattat-idhaiya.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: محطات إذاعية 1.${{ github.run_number }}
          files: mahattat-idhaiya.apk
          make_latest: true
